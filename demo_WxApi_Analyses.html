<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WxApi.Analyses - 微信好友微创业意向全景分析工作台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=PingFang+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-green: #07c160;
      --primary-hover: #06ad56;
      --primary-light: #e8f8ef;
      --accent-star: #faad14;
      --accent-star-bg: #fffbe6;
      --accent-ignore: #8c8c8c;
      --accent-ignore-bg: #f5f5f5;
      --chat-bubble-self: #95ec69;
      --chat-bubble-peer: #ffffff;
      --bg-base: #f0f2f5;
      --bg-sidebar: #f7f7f7;
      --bg-card: #ffffff;
      --border-color: #e5e6eb;
      --text-main: #1f2329;
      --text-sub: #646a73;
      --text-muted: #8f959e;
      --danger: #ff4d4f;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
      --shadow-lg: 0 10px 25px rgba(0,0,0,0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 现代滚动条全局定制 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.03);
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* 顶部导航与状态条 */
    .app-header {
      height: 58px;
      flex-shrink: 0;
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 20;
      box-shadow: var(--shadow-sm);
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, #07c160, #10b981);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 18px;
      box-shadow: 0 2px 6px rgba(7, 193, 96, 0.35);
    }

    .brand-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-main);
      letter-spacing: -0.3px;
    }

    .brand-badge {
      font-size: 11px;
      background: #eff6ff;
      color: #2563eb;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 500;
      border: 1px solid #dbeafe;
    }

    .stats-bar {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .stat-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      cursor: pointer;
      transition: all 0.2s;
    }
    .stat-pill:hover {
      background: #f1f5f9;
      transform: translateY(-1px);
    }
    .stat-pill.success { color: #059669; background: #ecfdf5; border-color: #a7f3d0; }
    .stat-pill.warning { color: #d97706; background: #fffbeb; border-color: #fde68a; }
    .stat-pill.muted { color: #64748b; background: #f8fafc; border-color: #cbd5e1; }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-header {
      height: 32px;
      padding: 0 12px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 500;
      border: 1px solid var(--border-color);
      background: white;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-header:hover {
      border-color: #07c160;
      color: #07c160;
    }

    /* 主界面布局 */
    .app-workspace {
      display: grid;
      grid-template-columns: 290px minmax(0, 1fr) 380px;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      background: #eaedf1;
    }

    /* ================= 1. 左侧好友列表栏 ================= */
    .contacts-sidebar {
      background: #ffffff;
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      min-width: 0;
      overflow: hidden;
    }

    .filter-header {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-color);
      background: #fafafa;
    }

    .search-box {
      position: relative;
      margin-bottom: 10px;
    }

    .search-input {
      width: 100%;
      height: 34px;
      border-radius: var(--radius-sm);
      border: 1px solid #d9d9d9;
      padding: 0 10px 0 32px;
      font-size: 12px;
      outline: none;
      transition: all 0.2s;
    }
    .search-input:focus {
      border-color: var(--primary-green);
      box-shadow: 0 0 0 2px rgba(7, 193, 96, 0.15);
    }
    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: #999;
      font-size: 13px;
    }

    .tier-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .tier-chip {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid #e5e7eb;
      background: #fff;
      color: #4b5563;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s;
    }
    .tier-chip:hover {
      background: #f3f4f6;
    }
    .tier-chip.active {
      background: #111827;
      color: #fff;
      border-color: #111827;
      font-weight: 500;
    }
    .tier-chip.s-tier.active { background: #ea580c; border-color: #ea580c; }
    .tier-chip.a-tier.active { background: #7c3aed; border-color: #7c3aed; }

    .contacts-list-container {
      flex: 1;
      overflow-y: auto;
    }

    .contact-item {
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #f2f3f5;
      cursor: pointer;
      position: relative;
      transition: background 0.15s;
    }
    .contact-item:hover {
      background: #f8fafc;
    }
    .contact-item.active {
      background: #f0fdf4;
      border-left: 4px solid var(--primary-green);
    }

    .avatar-wrap {
      position: relative;
      width: 42px;
      height: 42px;
      flex-shrink: 0;
    }
    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 6px;
      object-fit: cover;
      background: #e2e8f0;
      border: 1px solid rgba(0,0,0,0.06);
    }
    .tier-badge-sub {
      position: absolute;
      bottom: -2px;
      right: -2px;
      font-size: 9px;
      padding: 1px 4px;
      border-radius: 3px;
      font-weight: 700;
      color: #fff;
      box-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }
    .badge-S { background: #ea580c; }
    .badge-A { background: #7c3aed; }
    .badge-B { background: #2563eb; }
    .badge-C { background: #059669; }
    .badge-D { background: #64748b; }

    .contact-info {
      flex: 1;
      min-width: 0;
    }
    .contact-name-line {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 3px;
    }
    .contact-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .status-tag {
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 3px;
    }
    .tag-linked { background: #dcfce7; color: #15803d; }
    .tag-star { background: #fef3c7; color: #b45309; }
    .tag-ignored { background: #f1f5f9; color: #94a3b8; }
    .tag-pending { background: #f3f4f6; color: #6b7280; }

    .contact-desc {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ================= 2. 中间多维视角（聊天 + 朋友圈） ================= */
    .center-workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      height: 100%;
      min-height: 0;
      min-width: 0;
      border-right: 1px solid var(--border-color);
      background: #f5f6f8;
      overflow: hidden;
    }

    /* 微信聊天框区 */
    .chat-view-panel {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      min-width: 0;
      border-right: 1px solid var(--border-color);
      background: #f7f7f7;
      overflow: hidden;
    }

    .panel-header {
      height: 52px;
      padding: 0 16px;
      background: #fbfbfb;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .panel-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .panel-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
    }
    .panel-badge {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      background: #e2e8f0;
      color: #475569;
    }

    .chat-body {
      flex: 1;
      min-height: 0;
      padding: 16px;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: #f3f4f6;
    }

    .time-divider {
      align-self: center;
      font-size: 11px;
      color: #9ca3af;
      background: rgba(0,0,0,0.04);
      padding: 2px 10px;
      border-radius: 10px;
    }

    .chat-message-row {
      display: flex;
      gap: 10px;
      max-width: 86%;
    }
    .chat-message-row.peer {
      align-self: flex-start;
    }
    .chat-message-row.self {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 36px;
      height: 36px;
      border-radius: 4px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .msg-bubble-wrap {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .chat-message-row.self .msg-bubble-wrap {
      align-items: flex-end;
    }

    .msg-sender {
      font-size: 11px;
      color: #9ca3af;
    }

    .msg-bubble {
      padding: 9px 13px;
      font-size: 13px;
      line-height: 1.5;
      border-radius: 6px;
      position: relative;
      word-break: break-all;
      overflow-wrap: anywhere;
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }
    .peer .msg-bubble {
      background: var(--chat-bubble-peer);
      color: #1f2937;
      border-top-left-radius: 2px;
    }
    .self .msg-bubble {
      background: var(--chat-bubble-self);
      color: #111827;
      border-top-right-radius: 2px;
    }

    .msg-bubble.image-card {
      padding: 4px;
      background: white;
    }
    .msg-bubble img.chat-inline-img {
      max-width: 180px;
      max-height: 180px;
      border-radius: 4px;
      display: block;
    }

    .chat-composer-box {
      flex-shrink: 0;
      background: #ffffff;
      border-top: 1px solid var(--border-color);
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .composer-toolbar {
      display: flex;
      gap: 12px;
      color: #6b7280;
      font-size: 14px;
    }
    .composer-input {
      width: 100%;
      height: 52px;
      border: none;
      outline: none;
      resize: none;
      font-size: 13px;
      font-family: inherit;
    }
    .composer-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* 微信朋友圈区 (Moments) */
    .moments-view-panel {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      min-width: 0;
      background: #f7f7f8;
      overflow: hidden;
    }

    .moments-feed {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding-bottom: 24px;
    }

    .moments-cover-area {
      height: 140px;
      position: relative;
      background: linear-gradient(135deg, #374151, #1e293b);
      margin-bottom: 40px;
    }
    .cover-bg {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.85;
    }
    .user-profile-badge {
      position: absolute;
      right: 18px;
      bottom: -28px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .moments-user-name {
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      text-shadow: 0 1px 3px rgba(0,0,0,0.6);
      margin-bottom: 8px;
    }
    .moments-user-avatar {
      width: 64px;
      height: 64px;
      border-radius: 8px;
      border: 2px solid #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      object-fit: cover;
      background: #fff;
    }

    .moments-item {
      padding: 16px 18px;
      border-bottom: 1px solid #eef0f4;
      display: flex;
      gap: 12px;
    }
    .moments-author-avatar {
      width: 40px;
      height: 40px;
      border-radius: 6px;
      object-fit: cover;
      flex-shrink: 0;
    }
    .moments-content {
      flex: 1;
      min-width: 0;
    }
    .moments-author-name {
      font-size: 14px;
      font-weight: 600;
      color: #576b95;
      margin-bottom: 4px;
    }
    .moments-text {
      font-size: 13px;
      line-height: 1.55;
      color: #1f2329;
      margin-bottom: 8px;
      word-break: break-word;
    }
    .moments-grid-pics {
      display: grid;
      grid-template-columns: repeat(3, 85px);
      gap: 6px;
      margin-bottom: 8px;
    }
    .moments-grid-pics img {
      width: 85px;
      height: 85px;
      object-fit: cover;
      border-radius: 4px;
      cursor: pointer;
      background: #e2e8f0;
      transition: transform 0.2s;
    }
    .moments-grid-pics img:hover {
      transform: scale(1.02);
    }
    .moments-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: #8f959e;
      margin-top: 6px;
    }
    .moments-interaction-box {
      margin-top: 8px;
      background: #f3f4f6;
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 12px;
      position: relative;
    }
    .moments-likes {
      color: #576b95;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 4px;
      border-bottom: 1px solid #e5e7eb;
      padding-bottom: 4px;
      margin-bottom: 4px;
    }
    .moments-comments {
      display: flex;
      flex-direction: column;
      gap: 2px;
      color: #374151;
    }
    .moments-comments span {
      color: #576b95;
      font-weight: 500;
    }

    /* ================= 3. 右侧分析与破冰决策中心 ================= */
    .analysis-sidebar {
      background: #ffffff;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      min-width: 0;
      border-left: 1px solid var(--border-color);
      box-shadow: -2px 0 10px rgba(0,0,0,0.02);
      overflow: hidden;
    }

    .analysis-header {
      flex-shrink: 0;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-color);
      background: #fbfcfe;
    }
    .analysis-title {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #0f172a;
    }

    .analysis-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .insight-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: var(--radius-md);
      padding: 14px;
      box-shadow: var(--shadow-sm);
    }
    .insight-card-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #64748b;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .radar-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }
    .radar-tag {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 500;
    }
    .tag-blue { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
    .tag-green { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
    .tag-orange { background: #fff7ed; color: #c2410c; border: 1px solid #fed7aa; }
    .tag-purple { background: #faf5ff; color: #7e22ce; border: 1px solid #e9d5ff; }

    .insight-text {
      font-size: 12px;
      line-height: 1.6;
      color: #334155;
      background: #f8fafc;
      padding: 10px;
      border-radius: 6px;
      border-left: 3px solid #3b82f6;
    }

    /* 推荐破冰话术卡片 */
    .pitch-suggestion-card {
      background: #fcfdfe;
      border: 1px solid #cbd5e1;
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    .pitch-header {
      background: linear-gradient(90deg, #ecfdf5, #f0fdf4);
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      color: #065f46;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #d1fae5;
    }
    .pitch-body {
      padding: 12px;
      font-size: 13px;
      line-height: 1.6;
      color: #1f2937;
      white-space: pre-wrap;
    }
    .pitch-actions {
      padding: 8px 12px;
      background: #f8fafc;
      border-top: 1px solid #e2e8f0;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .btn-pitch {
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid #cbd5e1;
      background: white;
      transition: all 0.15s;
    }
    .btn-pitch:hover {
      border-color: #07c160;
      color: #07c160;
    }
    .btn-pitch.primary {
      background: #07c160;
      color: white;
      border-color: #07c160;
    }
    .btn-pitch.primary:hover {
      background: #06ad56;
    }

    /* 底部三大核心决策操作栏 (固定吸底，常驻显示) */
    .action-dock {
      flex-shrink: 0;
      padding: 14px 16px;
      border-top: 1px solid var(--border-color);
      background: #ffffff;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 -4px 16px rgba(0,0,0,0.08);
      z-index: 20;
    }

    .action-dock-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .btn-action {
      height: 42px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-action:active {
      transform: scale(0.97);
    }

    /* 1. 链接按钮 */
    .btn-action.btn-link {
      background: linear-gradient(135deg, #07c160, #10b981);
      color: #ffffff;
      box-shadow: 0 3px 8px rgba(7, 193, 96, 0.25);
    }
    .btn-action.btn-link:hover {
      box-shadow: 0 5px 12px rgba(7, 193, 96, 0.35);
      filter: brightness(1.05);
    }

    /* 2. 重点按钮 */
    .btn-action.btn-star {

    // 全局状态管理
    let contactsData = [...MOCK_CONTACTS];

      // 合并本地已标记的状态
      contactsData.forEach(c => {
        if (storageDb.linked.some(item => item.wxid === c.wxid)) c.status = "LINKED";

    // 渲染好友导航列表
    function renderContactsList() {
      const container = document.getElementById("contacts-list");
      const filtered = getFilteredContacts();

      if (filtered.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:40px 20px; color:#9ca3af; font-size:13px;">没有找到符合条件的好友</div>`;

      }

      container.innerHTML = filtered.map((c, idx) => {
        const isSelected = contactsData[currentIndex]?.wxid === c.wxid;

          LINKED: `<span class="status-tag tag-linked">已加入链接</span>`,

    // 获取过滤后的联系人
    function getFilteredContacts() {
      return contactsData.filter(c => {
        const matchesTier = currentFilterTier === "ALL" || c.tier === currentFilterTier;
        const matchesSearch = !currentSearchText || 
          c.name.toLowerCase().includes(currentSearchText.toLowerCase()) ||
          c.remark.toLowerCase().includes(currentSearchText.toLowerCase()) ||
          c.wxid.toLowerCase().includes(currentSearchText.toLowerCase());
        return matchesTier && matchesSearch;
      });
    }

    // 选中好友渲染全量详情
    function selectContact(index) {
      if (index < 0 || index >= contactsData.length) return;
      currentIndex = index;
      const contact = contactsData[currentIndex];

      // 1. 更新顶部指标
      document.getElementById("nav-index-indicator").innerText = `当前第 ${currentIndex + 1} / ${contactsData.length} 位`;

      // 2. 渲染聊天历史
      document.getElementById("chat-header-name").innerText = contact.name + (contact.remark ? ` (${contact.remark})` : '');
      document.getElementById("chat-header-wxid").innerText = contact.wxid;
      document.getElementById("chat-msg-count").innerText = contact.chatHistory.length;

      const chatBox = document.getElementById("chat-message-stream");
      chatBox.innerHTML = contact.chatHistory.map(msg => {
        const isSelf = msg.sender === "self";
        return `
          <div class="chat-message-row ${isSelf ? 'self' : 'peer'}">
            <img class="msg-avatar" src="${isSelf ? 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=120&h=120&q=80' : contact.avatar}" alt="avatar">
            <div class="msg-bubble-wrap">
              <span class="msg-sender">${isSelf ? '我' : contact.name} · ${msg.time}</span>
              <div class="msg-bubble">${msg.text}</div>
            </div>
          </div>
        `;
      }).join('');
      // 平滑滚动到底部
      chatBox.scrollTop = chatBox.scrollHeight;

      // 3. 渲染朋友圈
      const momentsBox = document.getElementById("moments-stream");
      momentsBox.innerHTML = `
        <div class="moments-cover-area">
          <img class="cover-bg" src="${contact.cover}" alt="cover">
          <div class="user-profile-badge">
            <span class="moments-user-name">${contact.name}</span>
            <img class="moments-user-avatar" src="${contact.avatar}" alt="avatar">
          </div>
        </div>
        ${contact.moments.map(m => `
          <div class="moments-item">
            <img class="moments-author-avatar" src="${contact.avatar}">
            <div class="moments-content">
              <div class="moments-author-name">${contact.name}</div>
              <div class="moments-text">${m.content}</div>
              ${m.images && m.images.length ? `
                <div class="moments-grid-pics">
                  ${m.images.map(img => `<img src="${img}" alt="pic">`).join('')}
                </div>
              ` : ''}
              <div class="moments-meta">
                <span>${m.date}</span>
                <span style="cursor:pointer; color:#576b95;">💬</span>
              </div>
              ${(m.likes.length || m.comments.length) ? `
                <div class="moments-interaction-box">
                  ${m.likes.length ? `<div class="moments-likes">❤️ ${m.likes.join('、')}</div>` : ''}
                  ${m.comments.length ? `
                    <div class="moments-comments">
                      ${m.comments.map(cm => `<div><span>${cm.user}</span>: ${cm.text}</div>`).join('')}
                    </div>
                  ` : ''}
                </div>
              ` : ''}
            </div>
          </div>
        `).join('')}
      `;

      // 4. 渲染 AI 意向画像 & 话术建议
      const analysisBox = document.getElementById("analysis-container");
      analysisBox.innerHTML = `
        <div class="insight-card">
          <div class="insight-card-title">
            <span>意向与痛点洞察</span>
            <span style="color:#ea580c; font-weight:700;">意向指数: ${contact.aiInsight.interestLevel}</span>
          </div>
          <div class="radar-tags">
            <span class="radar-tag tag-orange">${contact.tierLabel}</span>
            <span class="radar-tag tag-blue">痛点匹配</span>
            <span class="radar-tag tag-green">具备私域潜力</span>
          </div>
          <div class="insight-text">
            <strong>核心痛点：</strong>${contact.aiInsight.painPoint}<br><br>
            <strong>客群画像：</strong>${contact.aiInsight.profile}
          </div>
        </div>

        <div class="pitch-suggestion-card">
          <div class="pitch-header">
            <div style="display:flex; align-items:center; gap:6px;">
              <span>✨ AI 推荐最合适触达（链接）消息</span>
              <span id="pitch-learned-badge" style="${contact.aiInsight?.learnedFromSample ? '' : 'display:none;'} background:#ecfdf5; color:#047857; font-size:10px; padding:1px 6px; border-radius:10px; border:1px solid #a7f3d0; font-weight:600;">✨ 已融合样本学习优化</span>
            </div>
            <span style="font-size:11px; color:#047857;">基于对话+朋友圈定制</span>
          </div>
          
          <div class="pitch-body" id="current-pitch-text">${contact.aiInsight.recommendedPitch}</div>

          <!-- 编辑训练样本区域 -->
          <div id="pitch-edit-box" style="display:none; padding:12px; background:#f8fafc; border-bottom:1px solid #e2e8f0;">
            <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
              <span style="font-size:12px; font-weight:600; color:#0369a1; display:flex; align-items:center; gap:4px;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                编辑触达话术（保存为 AI 训练微调语料）
              </span>
              <span style="font-size:11px; color:#64748b;">持续沉淀为高质量话术语料</span>
            </div>
            <textarea id="pitch-edit-textarea" style="width:100%; min-height:88px; padding:10px; font-size:13px; line-height:1.6; border:1px solid #38bdf8; border-radius:6px; outline:none; resize:vertical; font-family:inherit; background:#ffffff; box-shadow:0 1px 2px rgba(0,0,0,0.05);"></textarea>
            <div style="display:flex; align-items:center; justify-content:space-between; margin-top:8px;">
              <div style="font-size:11px; color:#0284c7; display:flex; align-items:center; gap:4px;">
                <span>💡 保存后将沉淀为优质训练样本，后续同画像好友将自动参考该优化策略</span>
              </div>
              <div style="display:flex; gap:8px;">
                <button class="btn-pitch" onclick="cancelEditPitch()">取消</button>
                <button class="btn-pitch" id="btn-save-train" onclick="saveEditedPitchAsTrainingData()" style="background:#0284c7; color:white; border-color:#0284c7; font-weight:600;">💾 保存训练数据并应用</button>
              </div>
            </div>
          </div>

          <div class="pitch-actions" id="pitch-actions-bar">
            <button class="btn-pitch" id="btn-start-edit" onclick="startEditPitch()" style="display:inline-flex; align-items:center; gap:4px; color:#0284c7; border-color:#bae6fd; background:#f0f9ff;">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              编辑修改 (加入AI训练)

            对方今日发布朋友圈表达对当前模式的焦虑，且此前主动发起过合作询问。建议在 <strong>今日 12:00~13:30 或 晚上 20:30</strong> 直接通过微信发出轻量交流邀请，切中痛点，转化率极高。

      // 5. 填入推荐草稿到文本框
      document.getElementById("composer-text").value = contact.aiInsight.recommendedPitch;

      // 重新高亮左侧
      renderContactsList();

    function selectContactByWxid(wxid) {
      const idx = contactsData.findIndex(c => c.wxid === wxid);
      if (idx !== -1) {
        selectContact(idx);
      }
    }

    // 搜索与过滤
    function handleSearch(val) {
      currentSearchText = val;
      renderContactsList();
    }

    function filterTier(tier, el) {
      currentFilterTier = tier;
      document.querySelectorAll(".tier-chip").forEach(c => c.classList.remove("active"));
      el.classList.add("active");
      renderContactsList();
    }

    // 上一位 / 下一位导航
    function navContact(delta) {
      let nextIdx = currentIndex + delta;
      if (nextIdx < 0) nextIdx = 0;
      if (nextIdx >= contactsData.length) nextIdx = contactsData.length - 1;
      selectContact(nextIdx);
    }

    // 话术操作
    
    function startEditPitch() {
      const textElem = document.getElementById("current-pitch-text");
      const currentText = textElem.innerText;
      const textarea = document.getElementById("pitch-edit-textarea");
      textarea.value = currentText;
      textElem.style.display = "none";
      document.getElementById("pitch-actions-bar").style.display = "none";
      document.getElementById("pitch-edit-box").style.display = "block";
      textarea.focus();
    }

    function cancelEditPitch() {
      document.getElementById("pitch-edit-box").style.display = "none";
      document.getElementById("current-pitch-text").style.display = "block";
      document.getElementById("pitch-actions-bar").style.display = "flex";
    }

    async function saveEditedPitchAsTrainingData() {
      const textarea = document.getElementById("pitch-edit-textarea");
      const newPitch = textarea.value.trim();
      if (!newPitch) {
        showToast("编辑后的话术内容不能为空", "warning");
        return;
      }

      const contact = mockContacts[currentIndex];
      if (!contact) {
        showToast("当前未选中联系人", "error");
        return;
      }

      const btn = document.getElementById("btn-save-train");
      const originalText = btn.innerText;
      btn.disabled = true;
      btn.innerText = "正在保存微调数据...";

      try {
        // 同步内存数据
        if (contact.aiInsight) {
          contact.aiInsight.recommendedPitch = newPitch;
          contact.aiInsight.learnedFromSample = true;
        }
        document.getElementById("current-pitch-text").innerText = newPitch;

        // 同步更新到微信消息输入框
        const composer = document.getElementById("composer-text");
        if (composer) {
          composer.value = newPitch;
        }

        // 保存到 localStorage 作为演示持久化
        try {
          const key = "ai_training_samples";
          const samples = JSON.parse(localStorage.getItem(key) || "[]");
          samples.unshift({
            wxid: contact.wxid,
            name: contact.name,
            tier: contact.tier,
            editedPitch: newPitch,
            savedTime: new Date().toLocaleString()
          });
          localStorage.setItem(key, JSON.stringify(samples));
        } catch(e) {}

        // 如果后端服务在运行，同时提交给后端保存
        fetch("/api/ai/training-data", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            wxid: contact.wxid,
            name: contact.name,
            remark: contact.remark,
            tier: contact.tier,
            originalPitch: contact.aiInsight?.recommendedPitch || "",
            editedPitch: newPitch,
            painPoint: contact.aiInsight?.painPoint || "",
            profile: contact.aiInsight?.profile || ""
          })
        }).catch(() => {});

        const badge = document.getElementById("pitch-learned-badge");
        if (badge) badge.style.display = "inline-block";

        cancelEditPitch();
        showToast("🎉 已保存为 AI 训练样本！后续相同意向画像的建议已自动应用优化策略", "success");
      } catch (err) {
        showToast("保存失败: " + err.message, "error");
      } finally {
        btn.disabled = false;
        btn.innerText = originalText;
      }
    }

    function copyPitch() {
      const text = document.getElementById("current-pitch-text").innerText;
      navigator.clipboard.writeText(text).then(() => {
        showToast("已成功复制推荐消息到剪贴板！", "success");
      });
    }

    function applyPitchToComposer() {
      const text = document.getElementById("current-pitch-text").innerText;
      document.getElementById("composer-text").value = text;
      document.getElementById("composer-text").focus();
      showToast("已填入微信消息输入框", "info");
    }

    // 发送自定义消息（通过微信 Hook）
    function sendCustomMessage() {
      const text = document.getElementById("composer-text").value.trim();
      if (!text) {
        showToast("请输入消息内容", "warning");
        return;
      }
      const contact = contactsData[currentIndex];
      contact.chatHistory.push({
        sender: "self",
        time: "刚刚",
        text: text
      });
      selectContact(currentIndex);
      showToast(`已向 【${contact.name}】 发送消息 (Hook API: send_text_msg)`, "success");
    }

    function syncMoments() {
      showToast("正在通过 Hook 接口拉取朋友圈相册 (/api/sns_get_user_page2)...", "info");
      setTimeout(() => {
        showToast("朋友圈相册数据同步完毕！", "success");
      }, 900);
    }

    // ================= 核心决策操作：链接 / 重点 / 忽略 =================
    function decideContact(action) {
      const contact = contactsData[currentIndex];
      contact.status = action;

      // 移除原列表中旧数据
      storageDb.linked = storageDb.linked.filter(x => x.wxid !== contact.wxid);
      storageDb.starred = storageDb.starred.filter(x => x.wxid !== contact.wxid);
      storageDb.ignored = storageDb.ignored.filter(x => x.wxid !== contact.wxid);

      const recordItem = {
        wxid: contact.wxid,
        name: contact.name,
        remark: contact.remark,
        tier: contact.tier,
        pitch: contact.aiInsight.recommendedPitch,
        savedTime: new Date().toLocaleString()
      };

      if (action === "LINKED") {
        storageDb.linked.push(recordItem);
        localStorage.setItem('wx_analysis_linked', JSON.stringify(storageDb.linked));
        showToast(`✔ 已将【${contact.name}】加入【后继链接列表】(已自动保存本地文件)`, "success");
      } else if (action === "STARRED") {
        storageDb.starred.push(recordItem);
        localStorage.setItem('wx_analysis_starred', JSON.stringify(storageDb.starred));
        showToast(`⭐ 已将【${contact.name}】标记为【重点跟进对象】(已自动保存本地文件)`, "warning");
      } else if (action === "IGNORED") {
        storageDb.ignored.push(recordItem);
        localStorage.setItem('wx_analysis_ignored', JSON.stringify(storageDb.ignored));
        showToast(`⚪ 已将【${contact.name}】放入【忽略列表】(已自动保存本地文件)`, "info");
      }

      updateStats();
      renderContactsList();

      // 自动平滑进入下一位好友
      if (currentIndex < contactsData.length - 1) {
        setTimeout(() => {
          navContact(1);
        }, 350);
      }
    }

    // 更新统计栏
    function updateStats() {
      document.getElementById("stat-linked-count").innerText = storageDb.linked.length;
      document.getElementById("stat-starred-count").innerText = storageDb.starred.length;
      document.getElementById("stat-ignored-count").innerText = storageDb.ignored.length;
    }

    // Toast 提示
    function showToast(msg, type = "info") {
      const box = document.getElementById("toast-box");
      const toast = document.createElement("div");
      toast.className = `toast ${type}`;
      toast.innerText = msg;
      box.appendChild(toast);
      setTimeout(() => toast.classList.add("show"), 10);
      setTimeout(() => {
        toast.classList.remove("show");
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // 模态窗展示本地文件
    function showStorageModal(type) {
      const modal = document.getElementById("storage-modal");
      const title = document.getElementById("modal-title");
      const body = document.getElementById("modal-body-content");

      let items = [];
      let label = "";

      if (type === "linked") {
        label = "后继链接列表 (本地存储: linked_contacts.json)";
        items = storageDb.linked;
      } else if (type === "starred") {
        label = "重点跟进列表 (本地存储: starred_contacts.json)";
        items = storageDb.starred;
      } else if (type === "ignored") {
        label = "已忽略列表 (本地存储: ignored_contacts.json)";
        items = storageDb.ignored;
      } else {
        label = "本地持久化文件管理概览";
        items = [...storageDb.linked, ...storageDb.starred, ...storageDb.ignored];
      }

      title.innerText = label;

      if (items.length === 0) {
        body.innerHTML = `<div style="text-align:center; padding:30px; color:#9ca3af;">当前文件列表中暂无记录。请先在主界面点击【链接】、【重点】或【忽略】按钮添加。</div>`;
      } else {
        body.innerHTML = `
          <div style="margin-bottom:12px; display:flex; justify-content:space-between; align-items:center;">
            <span style="font-size:12px; color:#64748b;">共计 ${items.length} 条记录，实时同步在本地文件系统中。</span>
            <button class="btn-pitch primary" onclick="exportDataAsFile('${type}')">导出为 JSON / CSV</button>
          </div>
          <table class="table-list">
            <thead>
              <tr>
                <th>姓名/称呼</th>
                <th>wxid</th>
                <th>意向等级</th>
                <th>备注/身份</th>
                <th>推荐触达话术预览</th>
                <th>操作时间</th>
              </tr>
            </thead>
            <tbody>
              ${items.map(it => `
                <tr>
                  <td><strong>${it.name}</strong></td>
                  <td><code style="background:#f1f5f9; padding:2px 4px; border-radius:3px;">${it.wxid}</code></td>
                  <td>${it.tier || 'S'}级</td>
                  <td>${it.remark || '--'}</td>
                  <td style="max-width:240px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" title="${it.pitch}">${it.pitch || '--'}</td>
                  <td><span style="font-size:11px; color:#94a3b8;">${it.savedTime}</span></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      }

      modal.classList.add("open");
    }

    function closeStorageModal() {
      document.getElementById("storage-modal").classList.remove("open");
    }

    function exportDataAsFile(type) {
      showToast(`已生成并导出本地文件: ${type}_export_${Date.now()}.json`, "success");
    }

    function refreshAllData() {
      showToast("正在重新同步 Excel 数据与微信数据库...", "info");
      setTimeout(() => {
        showToast("同步完成！共载入 1,270 位好友（已自动剔除E级僵尸粉）", "success");
      }, 600);
    }

    // 快捷键支持：键盘左右键翻页
    document.addEventListener("keydown", (e) => {
      if (document.activeElement.tagName === "TEXTAREA" || document.activeElement.tagName === "INPUT") return;
      if (e.key === "ArrowLeft") navContact(-1);
      if (e.key === "ArrowRight") navContact(1);
    });

    // 启动
    init();
  </script>
</body>
</html>
